[project]
name = "jdagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ljm", email = "3321481586@qq.com" }
]
requires-python = ">=3.12"
packages = [{ from = "src", include = "app" }]
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jieba>=0.42.1",
    "passlib>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "pydantic>=2.14.2",
    "pymysql>=1.2.3",
    "python-jose>=3.5.0",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
jdagent = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI Depends() 在参数默认值中是官方惯用法

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
